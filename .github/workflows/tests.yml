name: Tests
on: [push, pull_request]
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    env:
      # The offline job must not download model weights. conftest.py pins the
      # test suite to the lexical stack; this covers the CLI steps below too.
      RETRIEVAL_PROFILE: lexical
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      # CPU-only torch: the default wheel ships CUDA libraries a hosted runner
      # will never use, and they dominate install time.
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - run: python -m src.pipeline --demo
      - run: python -m src.evaluation
      # The API and PDF paths are covered by pytest above; this checks the
      # app actually imports and mounts outside the test client.
      - run: python -c "from src.service.api import create_app; app = create_app('data/demo'); print(sorted(r.path for r in app.routes))"
